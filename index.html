<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genius Game Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Serif+JP:wght@200;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: #0a0a0f;
  color: #f0ece4;
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-pattern {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(120,60,40,0.08) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(60,80,120,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(100,60,100,0.05) 0%, transparent 50%);
}

.bg-pattern::after {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

.container {
  position: relative; z-index: 1;
  max-width: 800px; margin: 0 auto;
  padding: 60px 24px;
}

.arcade-header {
  text-align: center;
  margin-bottom: 64px;
}

.logo {
  font-family: 'Noto Serif JP', serif;
  font-weight: 200;
  font-size: clamp(3rem, 8vw, 5rem);
  letter-spacing: 0.15em;
  line-height: 1;
  color: #f0ece4;
}

.logo span {
  font-weight: 700;
  color: #c8a96e;
}

.tagline {
  margin-top: 16px;
  font-size: 0.85rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #666;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.game-card {
  position: relative;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 32px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  overflow: hidden;
}

.game-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--card-glow, rgba(200,169,110,0.1)) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.game-card:hover {
  border-color: rgba(255,255,255,0.15);
  transform: translateY(-4px);
}

.game-card:hover::before {
  opacity: 1;
}

.game-card.coming-soon {
  opacity: 0.4;
  cursor: not-allowed;
}

.game-card.coming-soon:hover {
  transform: none;
  border-color: rgba(255,255,255,0.08);
}

.game-icon {
  font-size: 2.5rem;
  margin-bottom: 4px;
}

.game-name {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.3rem;
  font-weight: 400;
}

.game-desc {
  font-size: 0.75rem;
  color: #888;
  line-height: 1.5;
}

.game-badge {
  position: absolute;
  top: 12px; right: 12px;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(200,169,110,0.2);
  color: #c8a96e;
}

.game-badge.soon {
  background: rgba(255,255,255,0.05);
  color: #555;
}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="container">
  <header class="arcade-header">
    <h1 class="logo">GENIUS<br><span>GAME</span></h1>
    <p class="tagline">Train your mind. One puzzle at a time.</p>
  </header>

  <div class="games-grid" id="gamesGrid">
    <!-- Games populated by JS -->
  </div>
</div>

<script>
const games = [
  {
    name: 'Sudoku',
    icon: '数',
    desc: 'Classic number puzzle with 8 difficulty levels',
    href: 'sudoku.html',
    badge: 'Play',
    glow: 'rgba(200,169,110,0.15)'
  },
  {
    name: 'Snake',
    icon: '蛇',
    desc: 'More games coming soon',
    href: null,
    badge: 'Soon',
    glow: 'rgba(100,200,100,0.1)',
    comingSoon: true
  },
  {
    name: 'Memory',
    icon: '記',
    desc: 'More games coming soon',
    href: null,
    badge: 'Soon',
    glow: 'rgba(100,100,200,0.1)',
    comingSoon: true
  },
  {
    name: 'Tetris',
    icon: '積',
    desc: 'More games coming soon',
    href: null,
    badge: 'Soon',
    glow: 'rgba(200,100,100,0.1)',
    comingSoon: true
  }
];

const grid = document.getElementById('gamesGrid');
games.forEach(game => {
  const card = document.createElement(game.href ? 'a' : 'div');
  card.className = 'game-card' + (game.comingSoon ? ' coming-soon' : '');
  card.style.setProperty('--card-glow', game.glow);
  if (game.href) card.href = game.href;

  card.innerHTML = `
    <span class="game-badge ${game.comingSoon ? 'soon' : ''}">${game.badge}</span>
    <div class="game-icon">${game.icon}</div>
    <div class="game-name">${game.name}</div>
    <div class="game-desc">${game.desc}</div>
  `;
  grid.appendChild(card);
});
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"75124c326cb447fe934cde04713ae013","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
